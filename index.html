<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#202020" />
    <title>О лудомании</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="intro" aria-labelledby="intro-title" data-screen="home">
        <header class="navigation">
          <button class="round-button" type="button">тест</button>
          <a class="brand-mark" href="#intro-title">
            <svg class="brand-shape" viewBox="0 0 338 132" aria-hidden="true" focusable="false">
              <path d="M66 0C29.5 0 0 29.5 0 66s29.5 66 66 66c28 0 49.5-18.5 71.5-39.5 17.5-16.8 40.5-16.8 63 0C222.5 113.5 244 132 272 132c36.5 0 66-29.5 66-66S308.5 0 272 0c-28 0-49.5 18.5-71.5 39.5-22.5 16.8-45.5 16.8-63 0C115.5 18.5 94 0 66 0Z" />
            </svg>
            <span>о лудомании</span>
          </a>
          <button class="round-button" type="button">помощь</button>
        </header>

        <div class="orb-grid">
          <button class="orb lime-orb menu-orb" type="button" data-scene-trigger aria-label="Открыть первую сцену">
            <span class="six-rings" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
          </button>
          <div class="orb blue-orb"><div class="nested-rings"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
          <div class="orb yellow-orb"><div class="flower-rings"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
          <div class="orb red-orb"><div class="vesica-rings"><i></i><i></i><i></i></div></div>
          <div class="orb black-orb"></div>
          <div class="orb black-orb"></div>
        </div>

        <p id="intro-title" class="statement">узнай, где найти поддержку,<br />если твой близкий играет в азартные игры</p>
      </section>

      <section class="ornament-scene" data-screen="ornament" aria-label="Первая сцена" hidden>
        <div class="ornament-grid" aria-label="Интерактивные элементы орнамента">
          <button class="ornament-ellipse" type="button" data-ellipse-id="north-west" aria-label="Эллипс 1"></button>
          <button class="ornament-ellipse" type="button" data-ellipse-id="north" aria-label="Эллипс 2"></button>
          <button class="ornament-ellipse" type="button" data-ellipse-id="north-east" aria-label="Эллипс 3"></button>
          <button class="ornament-ellipse" type="button" data-ellipse-id="west" aria-label="Эллипс 4"></button>
          <button class="ornament-ellipse" type="button" data-ellipse-id="center" aria-label="Эллипс 5"></button>
          <button class="ornament-ellipse" type="button" data-ellipse-id="east" aria-label="Эллипс 6"></button>
          <button class="ornament-ellipse" type="button" data-ellipse-id="south-west" aria-label="Эллипс 7"></button>
          <button class="ornament-ellipse" type="button" data-ellipse-id="south" aria-label="Эллипс 8"></button>
          <button class="ornament-ellipse" type="button" data-ellipse-id="south-east" aria-label="Эллипс 9"></button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
